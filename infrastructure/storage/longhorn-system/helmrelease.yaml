apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 10m
  chart:
    spec:
      chart: longhorn
      version: "1.11.3"
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: flux-system
  values:
    persistence:
      defaultClass: true
      defaultClassReplicaCount: 1   # IMPORTANT for single-node k3s
    defaultSettings:
      backupTarget: "s3://longhorn-backups@eu-north-1/"
      backupTargetCredentialSecret: "rustfs-backup-creds"
      defaultReplicaCount: 1
      engineReplicaTimeout:
        v1: "16"
        v2: "16"
      orphanAutoDeletion: true
      snapshotDataIntegrity: fast-check
      storageOverProvisioningPercentage: 200
      storageMinimalAvailablePercentage: 10
    ingress:
      enabled: false
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
        additionalLabels:
          release: kube-prometheus-stack
