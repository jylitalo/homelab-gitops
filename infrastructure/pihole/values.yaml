serviceDns:
  type: LoadBalancer

serviceWeb:
  type: LoadBalancer

DNS1: "1.1.1.1"
DNS2: "9.9.9.9"

persistentVolumeClaim:
  enabled: true
  storageClass: longhorn
  size: 1Gi

ingress:
  enabled: false

serviceDns:
  annotations:
    metallb.universe.tf/loadBalancerIPs: "192.168.1.130"

serviceWeb:
  annotations:
    metallb.universe.tf/loadBalancerIPs: "192.168.1.130"
