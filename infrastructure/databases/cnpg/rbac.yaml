apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cnpg-secret-reader
  namespace: databases
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cnpg-secret-reader-binding
  namespace: databases
subjects:
  - kind: ServiceAccount
    name: postgres
    namespace: databases
roleRef:
  kind: Role
  name: cnpg-secret-reader
  apiGroup: rbac.authorization.k8s.io

