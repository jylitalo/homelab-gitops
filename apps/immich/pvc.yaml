---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-import-library
  namespace: immich
spec:
  accessModes:
    - ReadOnlyMany
  storageClassName: immich-import
  volumeName: immich-import-pv
  resources:
    requests:
      storage: 1Ti
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-library
  namespace: immich
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: immich-local
  volumeName: immich-library-pv
  resources:
    requests:
      storage: 1Ti
