apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich-valkey
  namespace: immich
spec:
  interval: 30m

  chart:
    spec:
      chart: valkey
      version: "0.9.4"
      sourceRef:
        kind: HelmRepository
        name: valkey
        namespace: flux-system

  values:
    architecture: standalone

    auth:
      enabled: false
      # enabled: true
      # existingSecret: immich-valkey
      # existingSecretPasswordKey: password

    persistence:
      enabled: true
      storageClass: longhorn
      size: 2Gi

    resources:
      requests:
        cpu: 100m
        memory: 256Mi

      limits:
        cpu: 1000m
        memory: 1Gi
